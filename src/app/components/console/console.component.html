@if (loading()) {
  Loading...
} @else if (notFound()) {
  <app-page-not-found
    heading="Virtual Machine Not Found"
    [message]="
      'No virtual machines named &quot;' +
      name() +
      '&quot; were found that you have permission to access.'
    "
  ></app-page-not-found>
}
