@if (group().rows.length === 0) {
  <p class="iso-empty">No Files</p>
} @else {
  @for (row of group().rows; track rowKey(row)) {
    <div class="iso-row">
      @if (isDeleting(row)) {
        <mat-spinner [diameter]="20"></mat-spinner>
      } @else if (row.canDelete) {
        <button
          mat-icon-button
          color="warn"
          (click)="delete.emit(row)"
          matTooltip="Delete"
          aria-label="Delete"
        >
          <mat-icon
            class="mdi-24px"
            fontIcon="mdi-trash-can-outline"
          ></mat-icon>
        </button>
      }
      @if (row.missingProviders?.length) {
        <mat-icon
          class="mdi-24px iso-missing"
          fontIcon="mdi-alert"
          [matTooltip]="missingTooltip(row)"
          [attr.aria-label]="missingTooltip(row)"
        ></mat-icon>
      }
      <span class="iso-name">{{ row.filename }}</span>
    </div>
  }
}
