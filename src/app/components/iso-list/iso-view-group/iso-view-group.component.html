<mat-accordion multi class="iso-team-accordion">
  @for (group of groups(); track group.title) {
    <app-iso-group
      [group]="group"
      [deleting]="deleting()"
      (delete)="delete.emit($event)"
    ></app-iso-group>
  }
</mat-accordion>
