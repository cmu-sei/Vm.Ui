<mat-accordion multi class="iso-team-accordion">
  @for (group of groups(); track group.teamId ?? group.title) {
    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>{{ group.title }}</mat-panel-title>
        <mat-panel-description
          >Count: {{ group.rows.length }}</mat-panel-description
        >
      </mat-expansion-panel-header>
      <app-iso-group
        [group]="group"
        [deleting]="deleting()"
        (delete)="delete.emit($event)"
      ></app-iso-group>
    </mat-expansion-panel>
  }
</mat-accordion>
