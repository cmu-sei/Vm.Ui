<mat-toolbar class="toolbar" [style.backgroundColor]="'var(--crucible-topbar-background)'"
  [style.color]="'var(--crucible-topbar-text)'">
  <mat-toolbar-row>
    <span class="margin-auto">
      <button mat-icon-button class="home-logo" aria-label="Player VM">
        <mat-icon svgIcon="monitor"></mat-icon>
      </button>
    </span>
    <span class="view-text">VM</span>
    <span class="spacer"></span>
    @if (currentUser$ | async; as currentUser) {
    <div class="user-menu">
      <button mat-button [matMenuTriggerFor]="menu" matTooltip="Menu" aria-label="Menu">
        <strong>{{ currentUser.profile.name }}</strong>
        <mat-icon class="menu-trigger" fontIcon="mdi-chevron-down"></mat-icon>
      </button>
      <mat-menu #menu="matMenu" [overlapTrigger]="false" class="user-dropdown-menu">
        <button mat-menu-item (click)="logout()">Logout</button>
        <mat-slide-toggle aria-labelledby="theme-toggle" class="mat-menu-item toggle" color="primary"
          [checked]="(theme$ | async) === 'dark-theme' ? true : false" (click)="$event.stopPropagation()"
          (change)="themeFn($event)">
          <mat-label id="theme-toggle">Dark Theme</mat-label>
        </mat-slide-toggle>
      </mat-menu>
    </div>
    }
  </mat-toolbar-row>
</mat-toolbar>
