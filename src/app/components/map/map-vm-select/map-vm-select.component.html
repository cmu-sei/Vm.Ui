<crucible-dialog
  dialogTitle="Select VMs"
  [form]="form"
  submitLabel="Navigate"
  [submitDisabled]="form.controls.selected.value.length === 0"
  (submit)="redirect()"
>
  <div crucibleDialogContent [formGroup]="form" class="vm-select-form">
    <mat-form-field>
      <mat-label>Select VMs</mat-label>
      <mat-select multiple formControlName="selected">
        @for (vm of data.vms; track $index) {
          <mat-option [value]="vm">
            {{ vm }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>
</crucible-dialog>
